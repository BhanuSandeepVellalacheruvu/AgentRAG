[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrag"
version = "0.1.0"
description = "Multi-agent RAG application on zero-cost AWS infrastructure"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.47",
    "faiss-cpu>=1.14.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Runtime extras added per milestone — kept minimal here
agents = [
    "langgraph>=0.2",
    "langchain-aws>=0.1",
    "boto3>=1.34",
]
retrieval = [
    "faiss-cpu>=1.7",
    "boto3>=1.34",
    "pypdf>=4.0",
    "markdown>=3.6",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "mangum>=0.17",
]
infra = [
    "aws-cdk-lib>=2.140",
    "constructs>=10.3",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "boto3-stubs[bedrock-runtime,s3,dynamodb]>=1.34",
    "types-Markdown>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentrag"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "D",   # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public module  (handled per-file)
    "D104", # Missing docstring in public package (handled per-file)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict-ish
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# Ignore missing stubs for third-party libs that ship inline types
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--cov=src/agentrag --cov-fail-under=80 --cov-report=term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
