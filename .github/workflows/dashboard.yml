name: Update AWS Dashboard

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dashboard:
    name: Fetch AWS Metrics & Update Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Generate Dashboard Report
        run: python dashboard/generate_report.py
        env:
          AWS_REGION: us-east-1
          OUTPUT_PATH: dashboard/DASHBOARD.md

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/DASHBOARD.md
          git diff --staged --quiet || git commit -m "📊 auto-update: AWS infrastructure dashboard [$(date -u '+%Y-%m-%d')]"
          git push
