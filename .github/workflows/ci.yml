name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-type-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf  # v3
        with:
          version: "0.4.15"  # pinned — never use "latest" (SEC-007)

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies (with lockfile)
        run: uv sync --all-extras --frozen

      - name: Upgrade default build tools
        run: uv pip install --upgrade pip setuptools

      - name: Ruff — lint
        run: uv run ruff check src/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy — type check
        run: uv run mypy src/ tests/

      - name: Security — pip-audit (SEC-025)
        run: uv run pip-audit --skip-editable
        continue-on-error: false

      # SEC-019: generate a cryptographically random key — never hard-code test-key
      - name: Generate random test API key
        run: echo "API_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_ENV

      - name: Pytest — tests + coverage
        run: uv run pytest
        env:
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: agentrag-test-bucket-01
          # API_KEY is set by the step above via $GITHUB_ENV

  deploy:
    name: CD Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-type-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf  # v3
        with:
          version: "0.4.15"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies (with lockfile)
        run: uv sync --all-extras --frozen

      - name: Set up Node.js
        uses: actions/setup-node@3967849b24c824d2214ae6aa4f38539b2cf1a957  # v4.2.0
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd8a4cb17e0573650d18224c0e11971849a997  # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy CDK Stack
        working-directory: src/agentrag/infra
        run: npx aws-cdk deploy --require-approval never
        env:
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
          BUDGET_ALARM_THRESHOLD: "0.50"
