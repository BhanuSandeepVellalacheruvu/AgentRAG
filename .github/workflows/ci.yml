name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-type-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746c9  # v3.0.0
        with:
          version: "0.4.15"  # pinned — never use "latest" (SEC-007)

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies (with lockfile)
        run: uv sync --extra dev --frozen

      - name: Ruff — lint
        run: uv run ruff check src/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy — type check
        run: uv run mypy src/ tests/

      - name: Security — pip-audit (SEC-025)
        run: uv run pip-audit --strict
        continue-on-error: true  # warn-only until baseline established; flip to false before M4

      # SEC-019: generate a cryptographically random key — never hard-code test-key
      - name: Generate random test API key
        run: echo "API_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_ENV

      - name: Pytest — tests + coverage
        run: uv run pytest
        env:
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: test-bucket
          # API_KEY is set by the step above via $GITHUB_ENV
